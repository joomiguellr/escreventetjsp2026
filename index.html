<script>

const DS={LP:['Língua Portuguesa','#3b6fb6'],RD:['Redação (discursiva)','#7d8798'],PE:['Direito Penal','#8b5a9e'],PP:['Processual Penal','#b0507a'],PC:['Processual Civil','#c0763a'],CF:['Constitucional','#2f8f83'],AD:['Administrativo','#6b9130'],LI:['Legislação Interna','#8a7430'],AT:['Atualidades','#cc5d5d'],MA:['Matemática','#3d86b0'],IN:['Informática','#5b6fc2'],RL:['Raciocínio Lógico','#46906c']};
const TP=`LP|Interpretação e compreensão de textos (verbais, não verbais, literários e não literários)|3

PE|CP arts. 293–305, 307, 308 e 311-A (falsidades)|2

PE|CP arts. 328–333, 336 e 337 (crimes de particular contra a Administração)|2
PE|CP arts. 339–347, 357 e 359 (Administração da Justiça e outros)|2

PC|CPC arts. 188–275 (atos processuais, prazos e comunicação)|4

AD|Lei 10.261/68, arts. 171–175 e 239–323|3
AD|Lei 8.429/92 (Improbidade Administrativa)|2
LI|Resolução TJSP 850/2021 (teletrabalho)|1
LI|Resolução TJSP 963/2025 (governança e uso do eproc)|1

LI|Regimento Interno do TJSP|3
LI|NSCGJ Tomo I: Cap. II (Seção I, subseções I e II) e Cap. III (Seções I, II, V, VI e VII)|3
LI|NSCGJ Tomo I: Cap. III (Seção VIII, subseções I a III; Seções IX a XIX)|3
LI|NSCGJ Tomo I: Cap. XI (Seções I a VII)|2
AT|Atualidades (fatos a partir do 1º semestre de 2026)|2
AT|Lei 13.146/2015 (Estatuto da Pessoa com Deficiência), arts. 1º–13 e 34–38|1
MA|Operações com reais, MMC e MDC|1
MA|Razão, proporção, porcentagem e regra de três (simples e composta)|2
MA|Médias aritmética simples e ponderada; juros simples|1
MA|Equações do 1º e 2º graus e sistemas do 1º grau|2
MA|Relação entre grandezas, tabelas, gráficos e sistemas de medidas|1
MA|Geometria (perímetro, área, volume, ângulo, Pitágoras) e situações-problema|2
IN|MS-Windows 10+ (pastas, arquivos, atalhos, menus)|1
IN|MS-Word (Microsoft 365)|2
IN|MS-Excel (fórmulas, funções, gráficos, macros)|3
IN|Correio eletrônico e Internet|1
IN|MS Teams e OneDrive|1
RL|Estruturas lógicas e lógica de argumentação|3
RL|Diagramas lógicos e relações arbitrárias entre pessoas, lugares e eventos|2
RL|Sequências numéricas e figurais|2`.split('\n').map((l,i)=>{const[d,n,h]=l.split('|');return{id:i,d,n,h:+h}});
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0'),KEY='escTJSP1',EXAM='2027-03-14',WN=['dom','seg','ter','qua','qui','sex','sáb'];
const T=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const U=s=>new Date(s+'T00:00:00Z'),add=(s,n)=>new Date(U(s).getTime()+n*864e5).toISOString().slice(0,10),diff=(a,b)=>Math.round((U(b)-U(a))/864e5),fm=s=>s.split('-').reverse().join('/'),fs=s=>fm(s).slice(0,5),wd=s=>U(s).getUTCDay();
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const def={start:T(),end:'2027-03-13',hours:3,cycles:2,rev:true,rest:[],goal:20,done:{},rv:{},skip:{},extra:{},dif:{},q:{},sim:[]};
let S=Object.assign({},def,JSON.parse(ls.g(KEY)||'{}')),V={t:'ini',n:14,c:1,m:T().slice(0,7),sel:null};
const save=()=>{ls.s(KEY,JSON.stringify(S));render()};
const DC={f:['Fácil / dominado','var(--g)'],m:['Médio','var(--y)'],d:['Difícil','var(--r)']},RH={1:.2,7:.15,30:.1},RL={1:'24h',7:'7 dias',30:'30 dias'};
const dots=id=>`<span class="dots">${Object.keys(DC).map(x=>`<i class="dt${S.dif[id]==x?' on':''}" style="background:${DC[x][1]}" title="${DC[x][0]}" onclick="sd(${id},'${x}')"></i>`).join('')}</span>`;
const dcol=id=>S.dif[id]?DC[S.dif[id]][1]:'var(--ln)';
const leg=()=>`<div class="lg">${Object.values(DC).map(v=>`<span><i style="background:${v[1]}"></i>${v[0]}</span>`).join('')}<span><i style="background:var(--ln)"></i>Sem classificação</span></div>`;
const sd=(id,x)=>{S.dif[id]=S.dif[id]==x?'':x;save()};
const tn=k=>{if(S.done[k]){delete S.done[k];[1,7,30].forEach(n=>delete S.rv[k+'|'+n])}else S.done[k]=T();save()};
const tr=(k,n)=>{const x=k+'|'+n;if(S.rv[x])delete S.rv[x];else S.rv[x]=T();save()};
const tg=(w,d)=>{if(S[w][d])delete S[w][d];else S[w][d]=1;save()};
const isStudy=d=>!S.skip[d]&&(!S.rest.includes(wd(d))||S.extra[d]);
const revs=()=>{const a=[];if(!S.rev)return a;for(const k in S.done){const t=TP[+k.split(':')[1]];[1,7,30].forEach(n=>a.push({k,t,n,due:add(S.done[k],n),done:S.rv[k+'|'+n]}))}return a};
function plan(){const td=T(),st=S.start>td?S.start:td,q=[],days={};
 for(let c=1;c<=S.cycles;c++)TP.forEach(t=>{const k=c+':'+t.id;if(!S.done[k])q.push({k,t,c})});
 const rv=revs().filter(r=>!r.done).map(r=>({...r,h:r.t.h*RH[r.n]}));let d=st,last=null,g=0;
 while((q.length||rv.some(r=>!r.p&&r.due<=S.end))&&g++<1500){
  if(isStudy(d)){const it=[];let ld=0,nn=0;
   rv.forEach(r=>{if(!r.p&&r.due<=d&&r.due<=S.end){r.p=1;it.push({r:1,...r});ld+=r.h}});
   while(q.length&&ld<S.hours-.01&&(!nn||ld+q[0].t.h<=S.hours+.01)){const u=q.shift();it.push(u);ld+=u.t.h;nn++;if(S.rev)[1,7,30].forEach(n=>rv.push({k:u.k,t:u.t,n,due:add(d,n),sd:d,h:u.t.h*RH[n]}))}
   if(it.length){days[d]=it;last=d}}
  d=add(d,1)}
 return{days,last,st}}
function warn(P){if(!P.last||P.last<=S.end)return'';let R=0,A=0;for(const d in P.days)P.days[d].forEach(i=>R+=i.r?i.h:i.t.h);for(let d=P.st;d<=S.end;d=add(d,1))if(isStudy(d))A++;
 return`<div class="warn"><b>O conteúdo não cabe no período.</b> No ritmo atual ele termina em ${fm(P.last)}, depois da véspera da prova. ${A?`Para caber, estude cerca de ${Math.ceil(R/A*2)/2}h por dia, `:''}reduza os ciclos ou desative a revisão.</div>`}
const row=(it,d)=>{const t=it.t,s=DS[t.d][0];
 if(it.r)return`<div class="it" style="border-left-color:${dcol(t.id)}"><input type="checkbox" ${S.done[it.k]?'':'disabled'} onchange="tr('${it.k}',${it.n})"><div><span class="tag">Revisão de ${RL[it.n]}</span> ${t.n}<small>${s}, ${S.done[it.k]?'estudado em '+fm(S.done[it.k]):'previsto após estudar em '+fm(it.sd)}${it.due<d?' (atrasada)':''}</small></div>${dots(t.id)}</div>`;
 return`<div class="it" style="border-left-color:${DS[t.d][1]}"><input type="checkbox" onchange="tn('${it.k}')"><div>${t.n}<small>${s}${S.cycles>1?', ciclo '+it.c:''}, ${t.h}h</small></div>${dots(t.id)}</div>`};
const doneToday=()=>{const td=T();let h='';for(const k in S.done)if(S.done[k]==td){const t=TP[+k.split(':')[1]];h+=`<div class="it done" style="border-left-color:${DS[t.d][1]}"><input type="checkbox" checked onchange="tn('${k}')"><div>${t.n}<small>Estudado hoje</small></div>${dots(t.id)}</div>`}
 for(const x in S.rv)if(S.rv[x]==td){const[k,n]=x.split('|'),t=TP[+k.split(':')[1]];h+=`<div class="it done" style="border-left-color:${dcol(t.id)}"><input type="checkbox" checked onchange="tr('${k}',${n})"><div><span class="tag">Revisão de ${RL[n]}</span> ${t.n}<small>Revisado hoje</small></div></div>`}return h};
function dayCard(d,items){const td=T(),h=(items||[]).reduce((s,i)=>s+(i.r?i.h:i.t.h),0),rest=S.rest.includes(wd(d));let b='',body='';
 if(S.skip[d]){b=`<button class="sm" onclick="tg('skip','${d}')">Retomar</button>`;body='<small class="mu">Dia pulado. O conteúdo foi para o próximo dia de estudo.</small>'}
 else if(rest&&!S.extra[d]){b=`<button class="sm" onclick="tg('extra','${d}')">Estudar neste dia</button>`;body='<small class="mu">Dia de descanso.</small>'}
 else{b=(rest?`<button class="sm" onclick="tg('extra','${d}')">Voltar ao descanso</button> `:'')+`<button class="sm" onclick="tg('skip','${d}')">Pular dia</button>`;body=(d==td?doneToday():'')+(items&&items.length?items.map(i=>row(i,d)).join(''):(d==td&&doneToday()?'':'<small class="mu">Nada previsto.</small>'))}
 return`<div class="dh"><b>${d==td?'Hoje, ':''}${WN[wd(d)]} ${fs(d)}</b><span>${h?h.toFixed(1)+'h':''}</span>${b}</div>${body}`}
const inp=(l,k,t,x='')=>`<label>${l}<input type="${t}" value="${S[k]}" ${x} onchange="cfg('${k}',this.value)"></label>`;
function cfg(k,v){if(k=='rest'){const a=+v;S.rest=S.rest.includes(a)?S.rest.filter(x=>x!=a):[...S.rest,a];return save()}
 if(k=='rev')v=!!v;else if(k=='hours')v=Math.max(.5,+v||3);else if(k=='cycles')v=Math.min(8,Math.max(1,Math.floor(+v)||1));else if(k=='goal')v=Math.max(1,Math.floor(+v)||20);else if(!v)return render();
 S[k]=v;if(S.end<S.start)S.end=S.start;save()}
function reset(){if(confirm('Reiniciar o cronograma? Os assuntos estudados, revisões e dias pulados serão apagados e o início volta para hoje. Simulados e questões são mantidos.')){S.start=T();S.done={};S.rv={};S.skip={};S.extra={};save()}}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='escrevente-backup.json';a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign({},def,JSON.parse(r.result));save()}catch(e){alert('Arquivo inválido.')}};r.readAsText(f)}
function vIni(){const td=T(),P=plan(),ex=diff(td,EXAM),tot=S.cycles*TP.length,dn=Object.keys(S.done).filter(k=>+k.split(':')[0]<=S.cycles).length,len=diff(S.start,S.end)+1,el=Math.min(len,Math.max(0,diff(S.start,td))),pc=Math.round(el/len*100),qn=(S.q[td]||{}).n||0,rp=revs().filter(r=>!r.done&&r.due<=td).length,it=P.days[td]||[];
 const col=[24,53,82,111,140,169].map(x=>`<rect x="${x}" y="52" width="14" height="44"/>`).join('');
 return`<div class="card" style="display:flex;gap:24px;flex-wrap:wrap;align-items:center"><svg viewBox="0 0 200 120" style="width:260px;max-width:100%;flex:none"><defs><g id="tp"><path d="M100 6 192 36H8Z"/><rect x="14" y="42" width="172" height="6"/>${col}<rect x="10" y="98" width="180" height="6"/><rect x="4" y="106" width="192" height="8"/></g><linearGradient id="gd" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#a9832f"/><stop offset="1" stop-color="#e2c981"/></linearGradient><clipPath id="cl"><rect x="0" y="${120-1.2*pc}" width="200" height="120"/></clipPath></defs><use href="#tp" fill="#e3e8f0"/><use href="#tp" fill="url(#gd)" clip-path="url(#cl)"/></svg>
 <div style="flex:1;min-width:220px"><span class="mu">Faltam para a prova</span><b class="big">${ex>0?ex+' dias':ex==0?'É hoje':'Prova realizada'}</b><p class="mu" style="margin:4px 0 10px">Domingo, 14/03/2027, à tarde. O cronograma termina em ${fm(S.end)}.</p><div class="bar"><i style="width:${pc}%"></i></div><small class="mu">${pc}% do cronograma percorrido (dia ${Math.min(len,el+1)} de ${len})</small></div></div>${warn(P)}
 <div class="grid"><div class="card"><span class="mu">Assuntos estudados</span><b class="big">${dn}/${tot}</b><small class="mu">${Math.round(dn/tot*100)}% do conteúdo em ${S.cycles} ciclo(s)</small></div>
 <div class="card"><span class="mu">Questões hoje</span><b class="big">${qn}/${S.goal}</b><div class="bar"><i style="width:${Math.min(100,qn/S.goal*100)}%"></i></div></div>

const CUT=[['07/12/2025','1ª RAJ: 6 circunscrições (lista geral)',6.29,7,'São Bernardo 6,29; Santo André 6,71; Osasco 6,43; Guarulhos 6,43; Mogi das Cruzes 7,00; Itapecerica 6,43. Nota da Capital não localizada. Mesmo formato do edital atual (70 questões e redação).'],

 <h2>Notas de corte dos últimos concursos</h2><div class="card sc"><table><tr><th>Prova</th><th>Corte (lista geral)</th><th>Aproveitamento</th><th>Detalhes</th></tr>${CUT.map(c=>`<tr><td><b>${c[0]}</b><br><small class="mu">${c[1]}</small></td><td>${String(c[2]).replace('.',',')} a ${String(c[3]).replace('.',',')}</td><td>${(c[2]*10).toFixed(0)}% a ${(c[3]*10).toFixed(0)}%<br><small class="mu">${Math.round(c[2]*7)} a ${Math.round(c[3]*7)} acertos de 70</small></td><td><small>${c[4]}</small></td></tr>`).join('')}</table>

function vDes(){const td=T(),g=S.goal,q=S.q[td]||{n:0,a:0};let st=0,d=td;if(!((S.q[d]||{}).n>=g))d=add(d,-1);while((S.q[d]||{}).n>=g){st++;d=add(d,-1)}
 const D=Array.from({length:14},(_,i)=>add(td,i-13)),mx=Math.max(g,...D.map(x=>(S.q[x]||{}).n||0)),w7=D.slice(7).reduce((s,x)=>s+((S.q[x]||{}).n||0),0),tq=Object.values(S.q).reduce((s,x)=>s+x.n,0),ta=Object.values(S.q).reduce((s,x)=>s+(x.a||0),0),L=[...S.sim].sort((a,b)=>a.d<b.d?-1:1);
 const pts=L.map((s,i)=>`${L.length>1?10+i*280/(L.length-1):150},${70-sim1(s).pct*.6}`).join(' ');

 <div class="card"><h3>Registrar questões de hoje</h3><div class="row"><label>Feitas<input id="qn" type="number" min="0" style="width:90px"></label><label>Acertos (opcional)<input id="qa" type="number" min="0" style="width:90px"></label><button class="btn p" onclick="addQ()">Somar ao dia</button><button class="sm" onclick="if(confirm('Zerar as questões de hoje?')){delete S.q['${td}'];save()}">Zerar hoje</button></div></div>
 <div class="card"><h3>Questões por dia (últimos 14 dias, meta ${g})</h3><div class="bars">${D.map(x=>{const n=(S.q[x]||{}).n||0;return`<div><i style="height:${n/mx*90}px;${n>=g?'':'opacity:.55'}"></i>${n}<br>${fs(x)}</div>`}).join('')}</div></div>
 <div class="card"><h3>Conteúdo por matéria</h3>${Object.keys(DS).map(d=>{const L=TP.filter(t=>t.d==d),n=L.reduce((s,t)=>{for(let c=1;c<=S.cycles;c++)if(S.done[c+':'+t.id])s++;return s},0),tt=L.length*S.cycles;return`<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${DS[d][0]}</span><span class="mu">${n}/${tt}</span></div><div class="bar"><i style="width:${n/tt*100}%;background:${DS[d][1]}"></i></div></div>`}).join('')}</div>

function vDat(){const td=T(),nx=DT.find(x=>x[0]>=td);
 return`<h2>Datas importantes</h2><div class="card sc"><table>${DT.map(x=>`<tr style="${x[0]==nx[0]&&nx?'background:#faf4e3':''}${x[0]<td?';opacity:.5':''}"><td style="white-space:nowrap"><b>${fm(x[0])}</b><br><small class="mu">${x[0]<td?'passou':x[0]==td?'hoje':'em '+diff(td,x[0])+' dias'}</small></td><td>${x[1]}</td></tr>`).join('')}<tr><td><b>A definir</b></td><td>Edital de convocação com local e horário da prova (Diário Eletrônico da Justiça e área do candidato no site da VUNESP; o SMS e o e-mail são apenas informativos) e resultado final.</td></tr></table>

function vPro(){return`<h2>Tudo sobre a prova</h2>
 <div class="pen"><b class="big">Caneta esferográfica de tinta PRETA</b><p>O edital manda comparecer com caneta esferográfica de tinta preta (cap. IX, itens 10 e 19.4.5). A folha de respostas é lida por scanner e outra cor pode não ser detectada. A redação também é feita com tinta preta.</p><p><b>Leve duas ou mais canetas pretas.</b> Evite traço fraco ou claro. Lápis, corretivo e marca-texto não valem: na redação, corretivo e marca-texto geram nota zero e eliminação.</p><p><small>Observação: nos critérios de julgamento da redação o edital cita "preta ou azul-escura" como limite para não zerar o texto, mas a regra de comparecimento e a instrução da redação pedem preta. Use sempre preta.</small></p></div>
 <div class="grid g2"><div class="card"><h3>O que levar</h3><ul><li><b>Documento de identidade original</b>, em bom estado: RG, CNH com foto, CTPS, passaporte, carteira de conselho de classe, carteira das Forças Armadas ou Polícias, RNE ou CIN. Também vale o documento digital pelo app do órgão emissor (RG, CNH, e-Título com foto, CIN).</li><li>Não valem cópia (mesmo autenticada), protocolo nem boletim de ocorrência.</li><li><b>Caneta esferográfica preta</b>, mais de uma.</li><li>Confirmação do local e horário no edital de convocação. Na prova de dez/2025 os portões abriram às 12h00 e fecharam às 12h40, com início às 13h00.</li></ul></div>
 <div class="card"><h3>O que não levar ou deixar lacrado</h3><ul><li>Relógio de qualquer tipo, celular e aparelhos eletrônicos: desligados, com bateria retirada se possível, guardados na embalagem lacrada da VUNESP, sob a carteira.</li><li>Boné, gorro, chapéu, óculos de sol, protetor auricular e calculadora.</li><li>Livros, anotações e qualquer material de consulta.</li><li>Armas, mesmo com porte: eliminação.</li><li>Ao ir ao banheiro, só com fiscal e sem bolsas ou pertences.</li></ul></div></div>
 <div class="grid g2"><div class="card"><h3>Estrutura da prova</h3><ul><li>70 questões de múltipla escolha, 5 alternativas, todas com o mesmo valor, e redação no mesmo dia.</li><li>Bloco I, Língua Portuguesa: 16 questões.</li><li>Bloco II, Direito: 30 questões.</li><li>Bloco III, Gerais: 24 questões (Atualidades 4, Matemática 4, Informática 9, Raciocínio Lógico 7).</li><li>Duração máxima de 5 horas, já com a transcrição das respostas. Só se pode sair após 2 horas, e os 3 últimos candidatos saem juntos.</li></ul></div>
 <div class="card"><h3>Como se é aprovado</h3><ul><li>Nota mínima 5,0 na prova objetiva (35 acertos).</li><li>Blocos I e II eliminatórios: ao menos 50% em cada (8 de 16 e 15 de 30). O bloco III só classifica.</li><li>Redação vale 0 a 40 e é eliminatória: mínimo de 24 pontos (19,2 para vagas reservadas).</li><li>Só são corrigidas as redações dos candidatos mais bem colocados na objetiva da sua circunscrição (tabela no cap. XI do edital).</li><li>Desempate: 60 anos ou mais, mais acertos em Português, depois em Direito, e demais critérios do edital.</li></ul></div></div>
 <div class="grid g2"><div class="card"><h3>Folha de respostas</h3><ul><li>Questão em branco, com duas marcações ou com rasura ou emenda não é computada, mesmo legível.</li><li>Nada de marcas fora dos campos de resposta e assinatura.</li><li>Não há tempo extra para transcrever as respostas depois do fim da prova.</li><li>Confira nome e documento no caderno pré-identificado e assine no local indicado.</li></ul></div>
 <div class="card"><h3>Redação</h3><ul><li>Texto dissertativo-argumentativo em prosa, manuscrito, com letra legível e tinta preta.</li><li>Avaliação: tema, estrutura (posicionamento claro), língua e coesão.</li><li>Nota zero: fuga ao tema, 7 linhas ou menos, menos de 8 linhas autorais, cópia da coletânea ou de modelos prontos, nome ou sinal que identifique você, texto fora do espaço definitivo.</li><li>Rascunho e título não são avaliados. Evite 1ª pessoa do singular e referências aos textos de apoio. Proposta de intervenção não é exigida.</li></ul></div></div>
 <div class="card"><h3>Informações gerais</h3><ul><li>Cargo: Escrevente Técnico Judiciário, formação de cadastro de reserva. Vencimento de R$ 6.782,54 (março/2026) mais auxílios, jornada de 40 horas semanais.</li><li>Inscrição de R$ 81,00 pelo site www.vunesp.com.br. Há possibilidade de redução de 50% nos casos do edital (cap. II).</li><li>Requisitos: ensino médio concluído e 18 anos até a posse, entre outros do edital.</li><li>Não há segunda chamada. Atraso ou falta elimina. Não há revisão de prova, só recursos no prazo.</li></ul></div>`}
